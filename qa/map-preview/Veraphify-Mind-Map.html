:"remember","title":"Preserve replayable release evidence after artifact expiry","summary":"A later reviewer needs a documented way to recover both archived citations and their exact provenance after an ordinary Actions artifact ages out.","lifecycle":"captured","implementation":"not_planned","testing":"untested","related":["IDEA-000009","IDEA-000019","IDEA-000025"],"incoming":[],"citing":["FEAT-000008","FEAT-000011","FEAT-000035"]},{"id":"IDEA-000034","kind":"ideas","group":"release","title":"Give integrators a versioned CLI and archive reference","summary":"Document the command flags, identity fields, archive format, and verification output so wrappers can integrate using exact supported behavior.","lifecycle":"captured","implementation":"not_planned","testing":"untested","related":["IDEA-000011","IDEA-000020"],"incoming":[],"citing":["FEAT-000012","FEAT-000036"]},{"id":"IDEA-000035","kind":"ideas","group":"discover","title":"Make producer and physical Git citation coordinates explicit","summary":"Define which line coordinate a typed consumer returns and when archived source bytes are required to resolve a physical Git citation.","lifecycle":"captured","implementation":"not_planned","testing":"untested","related":["IDEA-000006","IDEA-000017","IDEA-000018"],"incoming":[],"citing":["FEAT-000021","FEAT-000038"]},{"id":"IDEA-000036","kind":"ideas","group":"prove","title":"Give each runtime an independently observable Veraphify job","summary":"The permanent Lydite branch plans product-specific checks across 14 languages. The adapted Vault carries a continuation of the same effort.","lifecycle":"captured","implementation":"not_planned","testing":"untested","related":["IDEA-000002","IDEA-000016","IDEA-000026","IDEA-000030","IDEA-000031"],"incoming":["IDEA-000037"],"citing":["FEAT-000039"]},{"id":"IDEA-000037","kind":"ideas","group":"archive","title":"Observe archive consistency while callers overlap","summary":"Exercise real concurrent imports and reads so the archive re roup":"prove","title":"Standalone Lydite v0.0.4 template branch","summary":"Veraphify has a separate Lydite-Test-Vault branch whose import tree is exactly the pinned upstream Lydite v0.0.4 tree.","lifecycle":"verified","implementation":"implemented","testing":"passed","origins":["IDEA-000026","IDEA-000016"],"release":"NOT_ASSERTED"},{"id":"FEAT-000027","kind":"features","group":"archive","title":"Checkout-bound archive import","summary":"Git object reads for an import follow the explicitly selected checkout, including a linked worktree and callers with another Git repository context.","lifecycle":"verified","implementation":"implemented","testing":"passed","origins":["IDEA-000027","IDEA-000013","IDEA-000017"],"release":"NOT_ASSERTED"},{"id":"FEAT-000028","kind":"features","group":"archive","title":"Unambiguous archive CLI options","summary":"Repeated options yield an explicit error, including repeated archive, project, and version selectors.","lifecycle":"verified","implementation":"implemented","testing":"passed","origins":["IDEA-000027","IDEA-000013"],"release":"NOT_ASSERTED"},{"id":"FEAT-000029","kind":"features","group":"archive","title":"Documented archive source and input limits","summary":"The adopter guide explains the aggregate source budget and other bounds. The importer names the path that would exceed the source budget.","lifecycle":"verified","implementation":"implemented","testing":"passed","origins":["IDEA-000028","IDEA-000011","IDEA-000017"],"release":"NOT_ASSERTED"},{"id":"FEAT-000030","kind":"features","group":"prove","title":"Standalone suite completion reconciliation","summary":"Standalone replay checks suite-level completion alongside the applicable named cases. Go, Python and PowerShell have explicitly tracked terminal result checks.","lifecycle":"verified","implementation":"implemented","testing":"passed","origins":["IDEA-000029","IDEA-000016","IDEA-000019"],"release":"NOT_ASSERTED"},{"id":"FEAT-000031","kind":"features","group":"prove","title":"Vault assertions that isolate their failure condition","summary":"Make reviewable regression cases fail for the behavior they claim, including staged interruption, diagnostics, retry source identity, and typed path and line checks.","lifecycle":"proposed","implementation":"not_planned","testing":"untested","origins":["IDEA-000031","IDEA-000002","IDEA-000016"],"release":"NOT_ASSERTED"},{"id":"FEAT-000032","kind":"features","group":"remember","title":"Read-only Provenistem inventory validation","summary":"Check record IDs, JSON shape, index coverage, idea references and source pins from an exact branch checkout.","lifecycle":"proposed","implementation":"not_planned","testing":"untested","origins":["IDEA-000032","IDEA-000014","IDEA-000025"],"release":"NOT_ASSERTED"},{"id":"FEAT-000033","kind":"features","group":"archive","title":"Preflight an adopter map against the import budget","summary":"Check the selected source inventory and relevant limits before invoking the expensive producer build.","lifecycle":"proposed","implementation":"not_planned","testing":"untested","origins":["IDEA-000028","IDEA-000011"],"release":"NOT_ASSERTED"},{"id":"FEAT-000034","kind":"features","group":"release","title":"Clean-checkout proof for downstream adopters","summary":"Record project-specific Graphify evidence that checks the kit and lock are available at the exact run checkout and walks real feature relationships.","lifecycle":"proposed","implementation":"not_planned","testing":"untested","origins":["IDEA-000030","IDEA-000006","IDEA-000023"],"release":"NOT_ASSERTED"},{"id":"FEAT-000035","kind":"features","group":"remember","title":"Replay evidence beyond the Actions artifact lifetime","summary":"Keep an approved replay origin and the run, attempt, artifact identity, digest and source pins needed for a later release review.","lifecycle":"proposed","implementation":"not_planned","testing":"untested","origins":["IDEA-000033","IDEA-000009","IDEA-000019","IDEA-000025"],"release":"NOT_ASSERTED"},{"id":"FEAT-000036","kind":"features","group":"release","title":"Versioned CLI and archive format reference","summary":"Give adopters a stable reference for CLI options, archive versioning, required pins and machine-readable results.","lifecycle":"proposed","implementation":"not_planned","testing":"untested","origins":["IDEA-000034","IDEA-000011","IDEA-000020"],"release":"NOT_ASSERTED"},{"id":"FEAT-000037","kind":"features","group":"discover","title":"Graph-guided discovery benchmark","summary":"Measure whether graph navigation uncovers useful implementation, test or document evidence missed by a defined baseline on representative project tasks.","lifecycle":"proposed","implementation":"not_planned","testing":"untested","origins":["IDEA-000004","IDEA-000001","IDEA-000006"],"release":"NOT_ASSERTED"},{"id":"FEAT-000038","kind":"features","group":"discover","title":"Typed citation coordinate contract","summary":"Name the producer graph coordinate returned by the typed consumer and expose a verified physical Git line only when the resolver has the pinned source bytes.","lifecycle":"proposed","implementation":"not_planned","testing":"untested","origins":["IDEA-000035","IDEA-000006","IDEA-000017"],"release":"NOT_ASSERTED"},{"id":"FEAT-000039","kind":"features","group":"prove","title":"First-party Veraphify mechanical proof across Lydite languages","summary":"Exercise real Veraphify entry points through the active runtimes, then add the adopter tracks as their actual interfaces become available.","lifecycle":"planned","implementation":"planned","testing":"untested","origins":["IDEA-000036","IDEA-000002","IDEA-000016","IDEA-000026"],"release":"NOT_ASSERTED"},{"id":"FEAT-000040","kind":"features","group":"archive","title":"Concurrent archive publication and readback proof","summary":"Coordinate actual CLI subprocesses to check identical retries, competing imports, and concurrent readers against one project and version.","lifecycle":"planned","implementation":"planned","testing":"untested","origins":["IDEA-000037","IDEA-000009","IDEA-000017","IDEA-000027"],"release":"NOT_ASSERTED"}],"tree":"https://github.com/vixttha/Veraphify/tree/afb3b19bd908bf111e0f62a4ccf69b9bf33bf2ec","blob":"https://github.com/vixttha/Veraphify/blob/afb3b19bd908bf111e0f62a4ccf69b9bf33bf2ec","totals":"37 ideas · 40 features · 85 directed idea references · 117 feature-to-idea links"}</script>
<script>
(() => {
  "use strict";
  const find = id => document.getElementById(id);
  const data = JSON.parse(find("catalog").textContent);
  const groups = new Map(data.groups.map(group => [group.id, group]));
  const nodes = new Map(data.records.map(record => [record.id, record]));
  const content = find("content");
  const nav = find("nav");
  const iconPaths = {
    overview: "M3 10l9-7 9 7v11h-6v-7H9v7H3z",
    discover: "M16 16l5 5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0z",
    archive: "M3 4h18v4H3zM5 8v12h14V8m-11 4h8",
    prove: "M12 22s8-3 8-10V6l-8-4-8 4v6c0 7 8 10 8 10zm-4-10l3 3 5-6",
    release: "M7 3v18m0-7c5 0 10-4 10-9M5 3h4m6 2h4M5 21h4",
    remember: "M6 3h12v18l-6-4-6 4z"
  };
  function element(tag, value, className) {
    const node = document.createElement(tag);
    if (value) node.textContent = value;
    if (className) node.className = className;
    return node;
  }
  function route(page, mode, record) {
    return "#/" + page + "/" + mode + (record ? "/" + record : "");
  }
  function parse() {
    const [page, mode, id] = location.hash.slice(2).split("/");
    const group = groups.get(page);
    const chosen = mode === "features" ? mode : "ideas";
    const node = nodes.get(id);
    const record = group && node?.group === group.id && node.kind === chosen ? node : null;
    return {page: group ? group.id : "overview", mode: chosen, record};
  }
  function link(label, href, className) {
    const node = element("a", label, className);
    node.href = href;
    return node;
  }
  function glyph(key) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    for (const [name,value] of Object.entries({width:22,height:22,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor","stroke-width":"1.6","stroke-linejoin":"round","stroke-linecap":"round","aria-hidden":"true"})) {
      svg.setAttribute(name,value);
    }
    const path = document.createElementNS(svg.namespaceURI,"path");
    path.setAttribute("d",iconPaths[key]);
    svg.append(path);
    return svg;
  }
  function heading(title, subtitle) {
    const node = element("h1",title);
    node.id = "content-heading";
    node.tabIndex = -1;
    content.append(node);
    if (subtitle) content.append(element("p",subtitle,"subtitle"));
  }
  function modeLinks(state, branch) {
    const wrapper = element("nav","",""+(branch ? "tabs" : "mode"));
    wrapper.setAttribute("aria-label","Record type");
    for (const [mode,label] of [["ideas","Ideas"],["features","Features"]]) {
      const a = link(label,route(state.page,mode));
      if (branch) a.append(element("small",String(branch[mode].length)));
      if (state.mode === mode) a.setAttribute("aria-current","page");
      wrapper.append(a);
    }
    content.append(wrapper);
  }
  function crumb(state, group, record) {
    const area = element("nav","","crumb");
    area.setAttribute("aria-label","Breadcrumb");
    area.append(link("Overview",route("overview",state.mode)),element("span","/"));
    if (record) area.append(link(group.label,route(group.id,state.mode)),element("span","/"),element("span",record.id,"mono"));
    else area.append(element("span",group.label));
    content.append(area);
  }
  function arrow() {
    const node = element("span","→","arrow");
    node.setAttribute("aria-hidden","true");
    return node;
  }
  function overview(state) {
    heading("Ideas & features");
    modeLinks(state);
    const map = element("div","","map");
    const connectors = element("div","","connectors");
    connectors.setAttribute("aria-hidden","true");
    const branches = element("nav","","branches");
    branches.setAttribute("aria-label","Catalog categories");
    for (const group of data.groups) {
      connectors.append(element("span","","connector"));
      const a = link("",route(group.id,state.mode),"branch");
      const copy = element("span");
      copy.append(element("strong",group.label),element("small",group.overview[state.mode]));
      a.append(copy,arrow());
      branches.append(a);
    }
    map.append(element("div","Provenistem","root"),connectors,branches);
    content.append(map);
    const inventory = element("details","","inventory");
    inventory.append(element("summary","Catalog details"),element("p",data.totals),element("p","Categories are an editorial grouping. Record pages preserve the original reference direction and status."));
    content.append(inventory);
  }
  function branchPage(state,group) {
    crumb(state,group);
    heading(group.label,group.description);
    modeLinks(state,group);
    const list = element("ul","","records");
    list.setAttribute("aria-label",group.label+" "+state.mode);
    for (const id of group[state.mode]) {
      const record = nodes.get(id);
      const row = element("li");
      const a = link("",route(group.id,state.mode,id),"record");
      a.append(element("span",id,"mono"),element("span",record.title,"record-title"),arrow());
      row.append(a);
      list.append(row);
    }
    if (!list.children.length) content.append(element("p","No records in this view.","none"));
    else content.append(list);
  }
  function addLinks(container, label, ids) {
    if (!ids.length) return;
    const detail = element("details");
    detail.append(element("summary",label+" ("+ids.length+")"));
    const list = element("ul","","links");
    for (const id of ids) {
      const n = nodes.get(id);
      const row = element("li");
      const a = link("",route(n.group,n.kind,id));
      a.append(element("span",id,"mono"),element("span",n.title));
      row.append(a);
      list.append(row);
    }
    detail.append(list);
    container.append(detail);
  }
  function recordPage(state,group,record) {
    crumb(state,group,record);
    const detail = element("article","","detail");
    detail.append(element("span",record.id,"mono"));
    const title = element("h1",record.title);
    title.id = "content-heading";
    title.tabIndex = -1;
    detail.append(title,element("p",record.summary));
    const status = element("div","","states");
    for (const [label,value] of [["Lifecycle",record.lifecycle],["Implementation",record.implementation],["Testing",record.testing],["Release membership",record.release]]) {
      if (!value) continue;
      const row = element("div");
      row.append(element("span",label),element("span",value.toLowerCase().replaceAll("_"," "),"value"));
      status.append(row);
    }
    detail.append(status,link("Open source record ↗",data.blob+"/"+record.kind+"/records/"+record.id+".json","external"));
    const related = element("div","","relationships");
    if (record.kind === "ideas") {
      addLinks(related,"This idea references",record.related);
      addLinks(related,"Ideas referencing this one",record.incoming);
      addLinks(related,"Features citing this idea",record.citing);
    } else {
      addLinks(related,"Originating ideas",record.origins);
    }
    detail.append(related);
    content.append(detail);
  }
  function render(moveFocus) {
    const state = parse();
    nav.replaceChildren();
    for (const [page,label] of [["overview","Overview"],...data.groups.map(g=>[g.id,g.label])]) {
      const a = link("",route(page,state.mode));
      a.append(glyph(page),element("span",label));
      if (page === state.page) a.setAttribute("aria-current","page");
      nav.append(a);
    }
    find("brand").href = route("overview",state.mode);
    find("source").href = data.tree;
    content.replaceChildren();
    if (state.record) recordPage(state,groups.get(state.page),state.record);
    else if (state.page === "overview") overview(state);
    else branchPage(state,groups.get(state.page));
    document.title = (state.record?.title || groups.get(state.page)?.label || "Ideas & features") + " · Veraphify";
    if (moveFocus) find("content-heading").focus();
  }
  window.addEventListener("hashchange",() => {
    if (location.hash.startsWith("#/") || location.hash === "") render(true);
  });
  document.querySelector(".skip").addEventListener("click",event => {
    event.preventDefault();
    find("content-heading").focus();
  });
  render(false);
})();
</script>
</body>
</html>
